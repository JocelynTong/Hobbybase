          &lt;h2&gt;岛内用户体系&lt;/h2&gt;
          &lt;p&gt;以单个岛为维度记录用户参与和共建。不同岛可以使用自己的等级称号，但等级判断遵循同一套五阶段结构。&lt;/p&gt;
          &lt;div class=&quot;list&quot;&gt;
            &lt;div class=&quot;list-row&quot;&gt;&lt;i data-lucide=&quot;footprints&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div class=&quot;list-copy&quot;&gt;&lt;strong&gt;LV1 · 普通用户 · 0-100&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;完成首次互动、发帖、资料提交或兴趣标记，开始形成岛内档案。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

            &lt;div class=&quot;list-row&quot;&gt;&lt;i data-lucide=&quot;star&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div class=&quot;list-copy&quot;&gt;&lt;strong&gt;LV3 · 贡献用户 · 1000-5000&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;记录被审核、采用或认可的有效贡献；贡献值只增不减。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;list-row&quot;&gt;&lt;i data-lucide=&quot;badge-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div class=&quot;list-copy&quot;&gt;&lt;strong&gt;LV4 · 专业用户 · 5000-10000&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;达到贡献门槛后，还需完成专业能力认证与人工审核。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

            &lt;div class=&quot;list-row&quot;&gt;&lt;i data-lucide=&quot;messages-square&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div class=&quot;list-copy&quot;&gt;&lt;strong&gt;社区内容&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;首次发帖用于入门；LV2 的有效内容计活跃；Score &amp;gt; 3，或被收藏、引用、有效讨论后，计入贡献。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;list-row&quot;&gt;&lt;i data-lucide=&quot;heart&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div class=&quot;list-copy&quot;&gt;&lt;strong&gt;互动与关注&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;点赞、评论、分享用于活跃和质量辅助判断，不直接等同贡献值；异常互动与刷量不计入。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;list-row&quot;&gt;&lt;i data-lucide=&quot;bookmark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div class=&quot;list-copy&quot;&gt;&lt;strong&gt;兴趣标记&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;拥有、玩过、去过、看过均保留为有效行为；具体贡献权重由品类和岛规则配置。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;

      &lt;div class=&quot;wear-flow&quot; aria-label=&quot;徽章佩戴与露出流程&quot;&gt;&lt;div class=&quot;flow-node&quot; data-flow-step=&quot;earned&quot;&gt;获得徽章 → 自动佩戴&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;&lt;div class=&quot;flow-node&quot; data-flow-step=&quot;exposure&quot;&gt;头像 ≥ 24px：个人主页、成长档案、正文作者、一级评论显示头像框&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;或&lt;/div&gt;&lt;div class=&quot;flow-node&quot;&gt;头像 &amp;lt; 24px：不显示头像框，徽章显示在昵称右侧&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;↓ 点击头像框&lt;/div&gt;&lt;div class=&quot;flow-node&quot; data-flow-step=&quot;wall&quot;&gt;进入全平台徽章墙&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;&lt;div class=&quot;flow-node&quot; data-flow-step=&quot;selected&quot;&gt;选择已获得徽章&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;&lt;div class=&quot;flow-node&quot; data-flow-step=&quot;applied&quot;&gt;更换佩戴 / 卸下 → 所有露出位置同步&lt;/div&gt;&lt;/div&gt;
    &lt;/details&gt;
    &lt;details class=&quot;decision-question&quot;&gt;
      &lt;summary&gt;3. 升级后可获得什么&lt;/summary&gt;
      &lt;div class=&quot;benefit-ladder&quot; aria-label=&quot;五级用户体系权益&quot;&gt;&lt;div class=&quot;benefit-level&quot;&gt;&lt;strong&gt;LV1&lt;/strong&gt;&lt;span&gt;记录反馈：查看贡献记录、升级进度与下一步。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;benefit-level&quot;&gt;&lt;strong&gt;LV2&lt;/strong&gt;&lt;span&gt;被看见：活跃身份、同好连接、有效内容基础曝光。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;benefit-level&quot;&gt;&lt;strong&gt;LV3&lt;/strong&gt;&lt;span&gt;提升共建效率：优质贡献展示、扩大资料编辑范围。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;benefit-level&quot;&gt;&lt;strong&gt;LV4&lt;/strong&gt;&lt;span&gt;专业协作：完成认证后，可申请审核与策展类角色。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;benefit-level&quot;&gt;&lt;strong&gt;LV5&lt;/strong&gt;&lt;span&gt;社区代表：官方合作、代表身份与治理提名。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;text-small decision-current&quot;&gt;等级负责认可贡献并解锁申请资格；专业认证与治理权仍需人工判断。&lt;/p&gt;
    &lt;/details&gt;
    &lt;details class=&quot;decision-question&quot;&gt;
      &lt;summary&gt;4. 有效行为如何构成与进阶&lt;/summary&gt;
      &lt;p class=&quot;text-small decision-current&quot;&gt;待验证假设：贡献值记录有效行为，但不让所有动作等价。&lt;/p&gt;
      &lt;div class=&quot;benefit-ladder&quot; aria-label=&quot;有效行为计分假设&quot;&gt;&lt;div class=&quot;benefit-level&quot;&gt;&lt;strong&gt;低权重&lt;/strong&gt;&lt;span&gt;访问、点赞、标记、工具使用等个人参与。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;benefit-level&quot;&gt;&lt;strong&gt;中权重&lt;/strong&gt;&lt;span&gt;发帖、评论、分享、挂单等主动产出。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;benefit-level&quot;&gt;&lt;strong&gt;高权重&lt;/strong&gt;&lt;span&gt;词条审核通过、结构化内容被使用、回答被认可等可验证贡献。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;text-small decision-current&quot;&gt;进阶假设：LV1 开始参与 → LV2 持续活跃 → LV3 产生可验证贡献 → LV4 专业认证 → LV5 代表性影响力与人工确认。&lt;/p&gt;
      &lt;strong class=&quot;text-small&quot;&gt;调研方案&lt;/strong&gt;
      &lt;ol class=&quot;research-plan text-small&quot;&gt;&lt;li&gt;数据回溯：抽取近 8–12 周不同类型岛，分析行为与次月留存、优质内容、资料采用及举报率的关系。&lt;/li&gt;&lt;li&gt;用户访谈：覆盖新用户、活跃者、核心贡献者与潜水用户 18–24 人；补充岛主/管理员 6–8 人。&lt;/li&gt;&lt;li&gt;行为卡片排序：让用户和管理员分别判断“价值、成本、可验证性、作弊风险”，形成行为字典。&lt;/li&gt;&lt;li&gt;影子计分：先运行 4 周但不展示等级，检查刷分、头部垄断、品类偏差和新用户劣势。&lt;/li&gt;&lt;li&gt;小范围灰度：选择 2–3 个不同品类岛运行 4 周，对比贡献率、优质内容率、次月留存和负反馈。&lt;/li&gt;&lt;/ol&gt;
      &lt;p class=&quot;text-small decision-current&quot;&gt;最终输出：行为口径、权重与上限、等级阈值、防刷规则、权益触发条件；上述分层和周期均不是最终规则。&lt;/p&gt;
    &lt;/details&gt;
